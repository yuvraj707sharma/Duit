services:
  - type: web
    name: duit-backend
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      # --- Production Secrets (set these in Render Dashboard) ---
      - key: SECRET_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GATEWAY_SHARED_SECRET
        generateValue: true
      - key: DESKTOP_SHARED_SECRET
        generateValue: true
      # --- Database ---
      - key: DATABASE_URL
        sync: false
      # --- Google OAuth ---
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # --- WhatsApp / Evolution ---
      - key: EVOLUTION_BASE_URL
        sync: false
      - key: EVOLUTION_GLOBAL_API_KEY
        sync: false
      - key: EVOLUTION_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_AUTHORIZED_NUMBERS
        sync: false
      # --- LLM ---
      - key: META_MODEL_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: duit-whatsapp
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: whatsapp/directorbot/Dockerfile
    dockerContext: whatsapp/directorbot
    envVars:
      - key: BACKEND_URL
        value: https://duit-backend.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GATEWAY_SHARED_SECRET
        sync: false
