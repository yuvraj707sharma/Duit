<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastAgent Admin Portal | WhatsApp AI Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body.login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
    }

    .bg-grid-overlay {
      display: none;
    }

    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      background: #0a0a0c;
      border: 1px solid #222226;
      border-top: 4px solid #facc15;
      border-radius: 12px;
      padding: 36px 32px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
      position: relative;
      overflow: hidden;
    }

    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logo {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: linear-gradient(135deg, #facc15, #eab308);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #000000;
      margin-bottom: 16px;
      box-shadow: 0 0 24px rgba(250, 204, 21, 0.4);
    }

    .login-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .login-subtitle {
      font-size: 0.9rem;
      color: #a1a1aa;
      font-weight: 500;
    }

    .login-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(250, 204, 21, 0.15);
      color: #facc15;
      border: 1px solid #facc15;
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      margin-top: 6px;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #71717a;
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .login-input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: #000000;
      border: 1px solid #27272a;
      border-radius: 8px;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.98rem;
      transition: all 0.2s ease;
      outline: none;
    }

    .login-input:focus {
      border-color: #facc15;
      box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.2);
      background: #000000;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #71717a;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }

    .password-toggle:hover {
      color: #facc15;
    }

    .btn-login {
      width: 100%;
      padding: 13px;
      margin-top: 24px;
      background: #facc15;
      color: #000000;
      border: 1px solid #eab308;
      border-radius: 8px;
      font-weight: 800;
      font-size: 1.05rem;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(250, 204, 21, 0.35);
      transition: all 0.2s ease;
    }

    .btn-login:hover:not(:disabled) {
      background: #eab308;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(250, 204, 21, 0.5);
    }

    .btn-login:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .login-alert {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      align-items: center;
      gap: 10px;
      line-height: 1.4;
    }

    .login-alert.error {
      display: flex;
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: #fda4af;
    }

    .login-alert.success {
      display: flex;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
    }

    .login-footer-info {
      text-align: center;
      margin-top: 22px;
      font-size: 0.76rem;
      color: var(--text-sub);
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading .spinner {
      display: inline-block;
    }
    .loading .btn-text {
      display: none;
    }
  </style>
</head>
<body class="dark-theme login-page">
  <div class="bg-grid-overlay"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <h1 class="login-title">FastAgent Command Center</h1>
        <div class="login-subtitle">Multi-User WhatsApp AI Agent Hub</div>
        <div class="login-badge">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Administrator Access
        </div>
      </div>

      <div id="login-alert" class="login-alert">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="login-alert-msg"></span>
      </div>

      <form id="login-form">
        <div class="form-group" style="margin-bottom: 18px;">
          <label for="email" style="font-size: 0.82rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px;">Executive Email Address</label>
          <div class="input-wrapper">
            <div class="input-icon">
              <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </div>
            <input 
              type="email" 
              id="email" 
              class="login-input" 
              placeholder="Enter official email" 
              required 
              autocomplete="username"
              autofocus
            >
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
            <label for="password" style="font-size: 0.82rem; font-weight: 600; color: var(--text-muted);">Security Passcode</label>
            <span style="font-size: 0.72rem; color: var(--text-sub);">Case sensitive</span>
          </div>
          <div class="input-wrapper">
            <div class="input-icon">
              <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <input 
              type="password" 
              id="password" 
              class="login-input" 
              placeholder="Enter passcode" 
              required 
              autocomplete="current-password"
            >
            <button type="button" class="password-toggle" id="btn-toggle-pwd" title="Show/Hide password">
              <svg id="eye-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="btn-submit">
          <div class="spinner"></div>
          <span class="btn-text">Authenticate & Open Hub</span>
          <svg class="btn-text" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <div class="login-footer-info">
        <span>Protected by Hardware-Accelerated Scrypt Authentication</span><br>
        <span style="opacity: 0.7;">Autonomous AI Chief of Staff &copy; JECRC University</span>
      </div>
    </div>
  </div>

  <script>
    // Subpath resolution helper
    let basePath = window.location.pathname.replace(/\/+$/, '');
    if (basePath.endsWith('.html') || basePath.includes('.htm')) {
      basePath = basePath.substring(0, basePath.lastIndexOf('/'));
    }
    if (basePath === '/' || !basePath) basePath = '';

    function resolveUrl(url) {
      if (!url) return '';
      if (url.startsWith('http://') || url.startsWith('https://')) return url;
      const clean = url.startsWith('/') ? url : `/${url}`;
      return `${basePath}${clean}`;
    }

    // Toggle Password Visibility
    const pwdInput = document.getElementById('password');
    const toggleBtn = document.getElementById('btn-toggle-pwd');
    toggleBtn.addEventListener('click', () => {
      const isPwd = pwdInput.type === 'password';
      pwdInput.type = isPwd ? 'text' : 'password';
      toggleBtn.style.color = isPwd ? 'var(--accent-cyan)' : 'var(--text-sub)';
    });

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('btn-submit');
    const alertBox = document.getElementById('login-alert');
    const alertMsg = document.getElementById('login-alert-msg');

    function showAlert(msg, isSuccess = false) {
      alertBox.className = isSuccess ? 'login-alert success' : 'login-alert error';
      alertMsg.textContent = msg;
    }

    function hideAlert() {
      alertBox.className = 'login-alert';
      alertMsg.textContent = '';
    }

    // If arrived via logout, ensure tokens are purged and avoid bouncing back
    if (window.location.search.includes('logout=true')) {
      try {
        localStorage.removeItem('auth_token');
        localStorage.removeItem('auth_user');
        sessionStorage.clear();
      } catch (e) {}
    } else {
      // Check if session already valid
      (async function checkExistingAuth() {
        const token = localStorage.getItem('auth_token');
        if (token) {
          try {
            const res = await fetch(resolveUrl('/api/auth/me'), {
              headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data && data.success) {
              window.location.replace(resolveUrl('/'));
            }
          } catch (e) {}
        }
      })();
    }

    // Handle Form Submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const email = document.getElementById('email').value.trim();
      const password = pwdInput.value;

      if (!email || !password) {
        showAlert('Please provide both your official email and passcode.');
        return;
      }

      submitBtn.classList.add('loading');
      submitBtn.disabled = true;

      try {
        const response = await fetch(resolveUrl('/api/auth/login'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          // Store token in localStorage
          if (data.token) {
            localStorage.setItem('auth_token', data.token);
          }
          if (data.user) {
            localStorage.setItem('auth_user', JSON.stringify(data.user));
          }

          showAlert('Authenticated successfully. Redirecting to Executive Hub...', true);
          
          setTimeout(() => {
            window.location.replace(resolveUrl('/'));
          }, 600);
        } else {
          showAlert(data.error || 'Authentication failed. Please verify credentials.');
          submitBtn.classList.remove('loading');
          submitBtn.disabled = false;
        }
      } catch (err) {
        showAlert('Connection error communicating with server. Please try again.');
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
